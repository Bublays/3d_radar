name: Daily 3D Printing Radar

# Cron je v UTC. 05:30 UTC = 07:30 SELČ (léto) / 06:30 SEČ (zima) —
# posun kvůli letnímu času je normální chování GitHub Actions cronu,
# ne chyba. Uprav podle potřeby.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # potřeba pro commit-back state/source_health.json
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_3dprinting.py --hours 48

      # state/source_health.json (anomaly tracking) musí přežít mezi
      # jednotlivými denními běhy, jinak "3x po sobě 0 položek" nikdy
      # nenabíhá. Commitujeme ho zpátky do repa hned po fetchi.
      - name: Commit updated source health state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update source health state [skip ci]"
          file_pattern: "state/source_health.json"

      - name: Build static site
        run: python scripts/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
